name: Release VSIX

# Tag a release and the extension is built, tested and attached to a GitHub Release
# together with the standalone UI preview.
#
#   npm version patch  (or minor/major)   ->  bumps package.json + creates the git tag
#   git push --follow-tags                ->  this workflow publishes v*.*.*
#
# You can also run it manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test (agent engine, HTTP providers, extension activation, chat panel)
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Build the standalone UI preview
        run: npm run preview

      - name: Read version from package.json
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: |
          npx vsce package --allow-missing-repository --skip-license --no-dependencies \
            --out "am-code-${{ steps.meta.outputs.version }}.vsix"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: am-code-vsix
          path: am-code-*.vsix

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AM Code ${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          # a tag like v0.2.0-beta.1 is published as a pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          # never wipe a hand-written release page — this block is appended, not replacing
          append_body: true
          body: |
            ## AM Code ${{ steps.meta.outputs.version }}

            ### نصب

            **ویندوز** — `AM-Code-Setup-*.exe` را از بخش Assets همین صفحه بگیر و اجرا کن
            (نصب برای کاربر جاری، بدون دسترسی ادمین). اگر SmartScreen هشدار داد: *More info → Run anyway*.

            **VS Code** — فایل `am-code-${{ steps.meta.outputs.version }}.vsix`:
            ```bash
            code --install-extension am-code-${{ steps.meta.outputs.version }}.vsix
            ```

            ### شروع کار
            چرخ‌دنده ⚙️ → **Models** → *Add model* → **Base URL** + **Model ID** → *Save & test connection*.

            ### چه چیزی داخلش است
            - ایجنت کدنویسی با Plan/Build، چک‌لیست زنده، ویرایش فایل با دیف واقعی، ترمینال و LSP
            - **مدل خودت** با Base URL + Model ID (سازگار با OpenAI یا نیتیو Anthropic)
            - **توکن‌سیور**: هر درخواست قبل از ارسال فشرده می‌شود
            - **MCP** گرافیکی (stdio + HTTP/SSE) با پریست‌های Godot / Unity / Unreal
            - دو چیدمان: پنل کنار کد و پنجرهٔ کامل به سبک OpenCode

            [CHANGELOG](https://github.com/Araz0-0dev/am-code/blob/main/CHANGELOG.md) · سازنده: [@AM0_0dev](https://t.me/AM0_0dev)
          files: |
            am-code-*.vsix
            panel-preview.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
